<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Probar servidor</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- TODO - Añadir el ion-item-->
  <ion-item>
    <ion-label position="stacked">Mensaje a enviar</ion-label>
    <ion-input placeholder="Escribe algo, por ejemplo: Hola servidor"
    [value]="mensaje()"
    (ionInput)="mensaje.set($event.detail.value ?? '')"></ion-input>
  </ion-item>

  <!-- TODO - Añadir el botón de envío -->
  <ion-button expand="block" class="ion-margin-top" (click)="enviarMensaje()" [disabled]="enviando()">
    Enviar al servidor
  </ion-button>

  <!-- TODO - Añadir el mensaje de respuesta y el error-->
   @if(respuesta()){
    <ion-card color="success">
      <ion-card-content>
        <p><strong>Respuesta: </strong>{{respuesta()}}</p>
        <p><strong>Recibido en: </strong>{{recibidoEn()}}</p>
      </ion-card-content>
    </ion-card>
   }
   @if(error()){
    <p style="color: red">Error: {{error()}}</p>
   }
  
</ion-content>
